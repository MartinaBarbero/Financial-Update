<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI-powered DCF valuation tool for deep-tech medtech startups. Auto-sources comparable companies, builds investor-ready Excel models with scenario analysis." />
    <title>Financial Valuation Tool — Deep-Tech DCF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f4f6fb;
        min-height: 100vh;
      }
      #root { min-height: 100vh; }
      /* Loading spinner shown before React mounts */
      #initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        flex-direction: column;
        gap: 16px;
        color: #1a2e4a;
      }
      #initial-loader .spinner {
        width: 40px; height: 40px;
        border: 3px solid #e0e7f0;
        border-top-color: #1a2e4a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <span style="font-size:14px;font-weight:500">Loading Valuation Tool…</span>
      </div>
    </div>
  </body>
</html>
